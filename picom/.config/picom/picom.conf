# Lean: no shadows, no blur. Rounded corners + light fade only.
backend = "glx";
vsync = true;
use-damage = true;
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'"
];
shadow = false;
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;
blur-background = false;
detect-client-opacity = true;
wintypes: {
  tooltip = { fade = true; opacity = 1; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
};
