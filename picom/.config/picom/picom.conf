# Rounded corners, soft shadows and spring-based window motion.
# Blur is on for the launcher only, so it costs nothing until a menu is open.
backend = "glx";
vsync = true;

# use-damage and no-rebind stay off: with them on, FreeCAD's 3D view showed stale frames.
use-damage = false;
glx-no-stencil = true;
glx-no-rebind-pixmap = false;
unredir-if-possible = false;

corner-radius = 12;

shadow = true;
shadow-radius = 22;
shadow-opacity = 0.42;
shadow-offset-x = -20;
shadow-offset-y = -14;
crop-shadow-to-monitor = true;

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

blur-method = "dual_kawase";
blur-strength = 7;
blur-background = false;
detect-client-opacity = true;
detect-rounded-corners = true;

# Two things change with the mood and are passed on the command line by
# ~/.config/i3/scripts/compositor.sh: --shadow-opacity (lighter by day) and, in
# `rice mode paper`, --window-shader-fg shaders/paper.glsl (e-ink for every window).

# Default motion for ordinary windows. The bezier overshoots 1.0, which gives the spring.
animations = (
  {
    triggers = ["open"];
    opacity = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.18; start = 0; end = "window-raw-opacity"; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = { curve = "cubic-bezier(0.34, 1.56, 0.64, 1)"; duration = 0.26; start = 0.82; end = 1; };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-x) / 2 * window-height";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    triggers = ["close"];
    opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.13; start = "window-raw-opacity-before"; end = 0; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.13; start = 1; end = 0.88; };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-x) / 2 * window-height";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  # Changing workspace: the new windows settle in from slightly small and a few
  # pixels low; the old ones just let go. The same in both directions, because
  # picom cannot know which way the workspace number moved.
  {
    triggers = ["show"];
    opacity = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.2; start = 0; end = "window-raw-opacity"; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.24; start = 0.94; end = 1; };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-x";
    rise = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.24; start = 14; end = 0; };
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-x) / 2 * window-height + rise";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    triggers = ["hide"];
    opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.1; start = "window-raw-opacity-before"; end = 0; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.1; start = 1; end = 0.97; };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-x) / 2 * window-height";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  { triggers = ["geometry"]; preset = "geometry-change"; duration = 0.18; }
);

# Later rules override earlier ones, option by option.
rules = (
  # Spotlight: unfocused tiles dim. Browsers, FreeCAD and the PDF reader stay bright
  # (video, 3D work, and reading a page while typing notes beside it).
  { match = "window_type = 'normal' && !focused && class_g !*?= 'thorium' && class_g != 'FreeCAD' && class_g != 'Zathura' && !fullscreen"; dim = 0.16; },

  { match = "window_type = 'desktop'"; shadow = false; corner-radius = 0; animations = (); },

  { match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip'";
    shadow = false; corner-radius = 0; animations = (); },
  { match = "window_type = 'dnd'"; shadow = false; animations = (); },
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; corner-radius = 0; },
  { match = "_NET_WM_STATE@[*] *= '_NET_WM_STATE_HIDDEN' || fullscreen"; shadow = false; },
  { match = "fullscreen"; corner-radius = 0; },

  # Direction names the side a window enters from. Polybar drops in from the top. Its pills are drawn inside a transparent window.
  { match = "window_type = 'dock'"; shadow = false; corner-radius = 0;
    animations = (
      { triggers = ["open", "show"]; preset = "fly-in"; direction = "up"; duration = 0.32; }
    ); },

  # Notifications fly in from the right edge and leave the same way.
  { match = "window_type = 'notification' || class_g = 'Dunst'";
    animations = (
      { triggers = ["open", "show"];  preset = "fly-in";  direction = "right"; duration = 0.26; },
      { triggers = ["close", "hide"]; preset = "fly-out"; direction = "right"; duration = 0.18; }
    ); },

  # The lock screen appears instantly, so it never reveals the desktop while animating.
  { match = "class_g = 'i3lock' || name = 'i3lock'"; shadow = false; corner-radius = 0; animations = (); },

  # The desktop cat draws its own pixel-art edges.
  { match = "class_g = 'mochi'"; dim = 0; shadow = false; corner-radius = 0; animations = (); },

  # Rofi: frosted glass over the wallpaper. It grows out of the centre and fades back.
  { match = "class_g = 'Rofi'"; blur-background = true; corner-radius = 24;
    animations = (
      { triggers = ["open", "show"];  preset = "appear";    scale = 0.92; duration = 0.16; },
      { triggers = ["close", "hide"]; preset = "disappear"; scale = 0.96; duration = 0.09; }
    ); }
);
