# Rounded corners, soft shadows, light fade. No blur (cost on every frame).
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;   # fullscreen apps bypass the compositor
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# 12 px everywhere: polybar, windows, rofi, dunst all share one radius
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "_GTK_FRAME_EXTENTS@"
];

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
shadow-offset-x = -16;
shadow-offset-y = -12;
crop-shadow-to-monitor = true;
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "window_type = 'dnd'",
  "_GTK_FRAME_EXTENTS@",
  "_NET_WM_STATE@[*] *= '_NET_WM_STATE_HIDDEN'",
  "fullscreen"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;
blur-background = false;
detect-client-opacity = true;
detect-rounded-corners = true;
