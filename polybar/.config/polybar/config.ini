; Colours: colors.ini (generated by ~/dotfiles/theme/apply.py)
; Rounded corners + shadow come from picom (corner-radius), not from polybar.
include-file = ~/.config/polybar/colors.ini

[bar/main]
width = 100%:-16
height = 32
offset-x = 8
offset-y = 8
line-size = 2
background = #00000000
foreground = ${colors.fg}
; *-font = N and %{TN} count from 1: 1 = text, 2 = icons (a size up), 3 = bold
font-0 = JetBrainsMono Nerd Font:style=Medium:size=11;3
font-1 = JetBrainsMono Nerd Font Propo:size=14;3
font-2 = JetBrainsMono Nerd Font:style=Bold:size=11;3
; fallbacks for window titles / song names: symbols, CJK, emoji
font-3 = DejaVu Sans:size=11;3
font-4 = Noto Sans CJK JP:size=12;3
font-5 = Noto Color Emoji:scale=10;2
font-6 = JetBrainsMono Nerd Font:size=23;6
padding = 0
module-margin = 0
modules-left = caplp ball caprp gap capl i3 capr gap music caplb title caprb gap pet
modules-center = capla time date capra
modules-right = capl tray capr gap capl cpu memory capr gap capl pulseaudio wifi eth capr gap capl battery capr gap capl mood capr gap caplc power caprc
enable-ipc = true
cursor-click = pointer
; Not an i3 dock: i3 would stretch a dock to full width at y=0 and ignore the
; offsets. i3 reserves the space instead (gaps top in the i3 config).
override-redirect = true
wm-restack = i3
compositing-background = source

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
ws-icon-0 = 1;一
ws-icon-1 = 2;二
ws-icon-2 = 3;三
ws-icon-3 = 4;四
ws-icon-4 = 5;五
ws-icon-5 = 6;六
ws-icon-6 = 7;七
ws-icon-7 = 8;八
ws-icon-8 = 9;九
ws-icon-9 = 10;十
ws-icon-default = ◆
format = <label-state> <label-mode>
label-mode = " %mode% "
label-mode-background = ${colors.accent2}
label-mode-foreground = ${colors.bg-solid}
label-mode-font = 3
label-focused = %icon%
label-focused-font = 3
label-focused-foreground = ${colors.bg-solid}
label-focused-background = ${colors.accent}
label-focused-padding = 2
label-unfocused = %icon%
label-unfocused-foreground = ${colors.fg}
label-unfocused-background = ${colors.surface}
label-unfocused-padding = 2
label-visible = %icon%
label-visible-foreground = ${colors.fg}
label-visible-background = ${colors.surface1}
label-visible-padding = 2
label-urgent = %icon%
label-urgent-font = 3
label-urgent-background = ${colors.crit}
label-urgent-foreground = ${colors.bg-solid}
label-urgent-padding = 2

[module/music]
type = custom/script
exec = ~/.config/polybar/scripts/music.sh
tail = true
click-left = playerctl -p limusic play-pause
click-right = playerctl -p limusic next
click-middle = ~/.config/i3/scripts/limusic-toggle.sh
label = %output%

[module/title]
type = internal/xwindow
format-background = ${colors.blue}
format-padding = 1
format-prefix = "󰖯 "
format-prefix-font = 2
format-prefix-foreground = ${colors.bg-solid}
label = %title:0:14:…%
label-foreground = ${colors.bg-solid}
label-empty = desktop
label-empty-foreground = ${colors.bg-solid}

[module/time]
type = internal/date
format-background = ${colors.accent}
format-padding = 1
interval = 1
time = %I:%M %p
time-alt = %I:%M:%S %p
format-prefix = "󰥔 "
format-prefix-font = 2
format-prefix-foreground = ${colors.bg-solid}
label = %time%
label-font = 3
label-foreground = ${colors.bg-solid}

[module/date]
type = internal/date
format-background = ${colors.accent}
format-padding = 1
interval = 60
date = %d %b
date-alt = %A, %d %B %Y
label = %date%
label-foreground = ${colors.bg-solid}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-background = ${colors.surface}
format-volume-padding = 1
format-muted-background = ${colors.surface}
format-muted-padding = 1
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = 󰝟 mute
label-muted-font = 1
label-muted-foreground = ${colors.dim}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-font = 2
ramp-volume-foreground = ${colors.bryellow}
click-right = pavucontrol

[module/wifi]
type = internal/network
format-connected-background = ${colors.surface}
format-connected-padding = 1
format-disconnected-background = ${colors.surface}
format-disconnected-padding = 1
interface-type = wireless
interval = 5
format-connected = <ramp-signal> <label-connected>
label-connected = %essid:0:14:…%
ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨
ramp-signal-font = 2
ramp-signal-foreground = ${colors.cyan}
format-disconnected = <label-disconnected>
label-disconnected = 󰤭
label-disconnected-font = 2
label-disconnected-foreground = ${colors.dim}
click-left = nm-connection-editor

[module/eth]
type = internal/network
format-connected-background = ${colors.surface}
format-connected-padding = 1
interface-type = wired
interval = 5
format-connected-prefix = "󰈀 "
format-connected-prefix-font = 2
format-connected-prefix-foreground = ${colors.cyan}
label-connected = lan
format-disconnected =

[module/cpu]
type = internal/cpu
format-background = ${colors.surface}
format-padding = 1
format-warn-background = ${colors.surface}
format-warn-padding = 1
interval = 1
format = <ramp-coreload> <label>
format-prefix = "󰍛 "
format-prefix-font = 2
format-prefix-foreground = ${colors.blue}
label = %percentage:2%%
ramp-coreload-spacing = 0
ramp-coreload-0 = ▁
ramp-coreload-0-foreground = ${colors.blue}
ramp-coreload-1 = ▂
ramp-coreload-1-foreground = ${colors.cyan}
ramp-coreload-2 = ▃
ramp-coreload-2-foreground = ${colors.cyan}
ramp-coreload-3 = ▄
ramp-coreload-3-foreground = ${colors.green}
ramp-coreload-4 = ▅
ramp-coreload-4-foreground = ${colors.green}
ramp-coreload-5 = ▆
ramp-coreload-5-foreground = ${colors.yellow}
ramp-coreload-6 = ▇
ramp-coreload-6-foreground = ${colors.warn}
ramp-coreload-7 = █
ramp-coreload-7-foreground = ${colors.crit}
warn-percentage = 90
format-warn-prefix = "󰍛 "
format-warn-prefix-font = 2
format-warn-prefix-foreground = ${colors.crit}
format-warn = <ramp-coreload> <label-warn>
label-warn = %percentage:2%%
label-warn-foreground = ${colors.crit}

[module/memory]
type = internal/memory
format-background = ${colors.surface}
format-padding = 1
format-warn-background = ${colors.surface}
format-warn-padding = 1
interval = 3
format-prefix = "󰘚 "
format-prefix-font = 2
format-prefix-foreground = ${colors.magenta}
label = %percentage_used:2%%
warn-percentage = 90
format-warn-prefix = "󰘚 "
format-warn-prefix-font = 2
format-warn-prefix-foreground = ${colors.crit}
format-warn = <label-warn>
label-warn = %percentage_used:2%%
label-warn-foreground = ${colors.crit}

; Battery as a hit-point bar: green above half, yellow below, red under a fifth.
[module/battery]
type = custom/script
format-background = ${colors.surface}
format-padding = 1
exec = ~/.config/polybar/scripts/battery.sh
interval = 15
click-left = ~/.config/i3/scripts/settings.sh

; Poké Ball: left click = launcher, right click = file search, middle = a new mathematical wallpaper
[module/ball]
type = custom/text
format = "󰐝"
format-font = 2
format-background = ${colors.accent2}
format-foreground = ${colors.bg-solid}
click-left = ~/.config/rofi/scripts/launcher.sh apps
click-right = ~/.config/rofi/scripts/launcher.sh files
click-middle = ~/.local/bin/rice art

[module/caplp]
type = custom/text
format = ""
format-font = 7
format-foreground = ${colors.accent2}

[module/caprp]
type = custom/text
format = ""
format-font = 7
format-foreground = ${colors.accent2}

; Mood: night / day / paper. Left click = next mood, right click = mood and wallpaper menu
[module/mood]
type = custom/script
format-background = ${colors.surface}
format-padding = 1
exec = ~/.config/polybar/scripts/mood.sh
interval = 3600
click-left = ~/.local/bin/rice mode next
click-right = ~/.local/bin/rice menu

[module/power]
type = custom/text
format-background = ${colors.crit}
format-padding = 1
format = "⏻"
format-font = 2
format-foreground = ${colors.bg-solid}
click-left = ~/.config/i3/scripts/powermenu.sh

[module/tray]
type = internal/tray
tray-spacing = 8
tray-size = 62%
tray-background = ${colors.surface}
format-background = ${colors.surface}

[module/capl]
type = custom/text
format = ""
format-font = 7
format-foreground = ${colors.surface}

[module/capr]
type = custom/text
format = ""
format-font = 7
format-foreground = ${colors.surface}

[module/gap]
type = custom/text
format = " "

[module/capla]
type = custom/text
format = ""
format-font = 7
format-foreground = ${colors.accent}

[module/capra]
type = custom/text
format = ""
format-font = 7
format-foreground = ${colors.accent}

[module/caplc]
type = custom/text
format = ""
format-font = 7
format-foreground = ${colors.crit}

[module/caprc]
type = custom/text
format = ""
format-font = 7
format-foreground = ${colors.crit}

[module/pet]
type = custom/script
exec = ~/.config/polybar/scripts/pet.sh
tail = true
click-left = pkill -USR1 -xf "/bin/bash .*pet.sh"
click-right = ~/.config/i3/scripts/mochi-toggle.sh

[module/caplb]
type = custom/text
format = ""
format-font = 7
format-foreground = ${colors.blue}

[module/caprb]
type = custom/text
format = ""
format-font = 7
format-foreground = ${colors.blue}

[settings]
screenchange-reload = true
pseudo-transparency = false
