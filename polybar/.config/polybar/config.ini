; Colours: colors.ini (generated by ~/dotfiles/theme/apply.py)
include-file = ~/.config/polybar/colors.ini

[bar/main]
width = 100%:-12
height = 30
offset-x = 6
offset-y = 4
radius = 10
border-size = 1
border-color = ${colors.surface}
line-size = 2
background = ${colors.bg}
foreground = ${colors.fg}
font-0 = JetBrainsMono Nerd Font:size=10;3
font-1 = JetBrainsMono Nerd Font:size=12;3
padding = 2
module-margin = 1
separator = " "
separator-foreground = ${colors.dim}
modules-left = i3 title
modules-center = date
modules-right = tray pulseaudio wifi eth cpu memory battery
enable-ipc = true
cursor-click = pointer

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
label-focused = %name%
label-focused-foreground = ${colors.bg}
label-focused-background = ${colors.accent}
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 2
label-visible = %name%
label-visible-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.crit}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 2

[module/title]
type = internal/xwindow
label = %title:0:40:...%
label-foreground = ${colors.dim}

[module/date]
type = internal/date
interval = 30
date = %a %d %b
time = %I:%M %p
label = %date%  %time%
label-foreground = ${colors.fg}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
format-volume-foreground = ${colors.fg}
label-volume = %percentage%%
label-muted = 󰝟 muted
label-muted-foreground = ${colors.dim}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.accent}
click-right = pavucontrol

[module/wifi]
type = internal/network
interface = wlo1
interval = 5
format-connected = <label-connected>
label-connected = 󰤨 %essid%
label-connected-foreground = ${colors.fg}
format-disconnected =
click-left = nm-connection-editor

[module/eth]
type = internal/network
interface = eno1
interval = 5
format-connected = <label-connected>
label-connected = 󰈀 up
format-disconnected =

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%
warn-percentage = 90
format-warn = <label-warn>
label-warn = " %percentage:2%%"
label-warn-foreground = ${colors.crit}

[module/memory]
type = internal/memory
interval = 3
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label = %percentage_used:2%%

[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
interval = 5
click-left = ~/.config/i3/scripts/settings.sh

[settings]
screenchange-reload = true
pseudo-transparency = false

[module/tray]
type = internal/tray
tray-spacing = 6
tray-size = 60%
tray-background = ${colors.bg}
