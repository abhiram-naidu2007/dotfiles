; Colours: colors.ini (generated by ~/dotfiles/theme/apply.py)
; Rounded corners + shadow come from picom (corner-radius), not from polybar.
;
; Layout, 1904 px wide. Everything is a pill on the surface colour; only the launcher
; (left), the focused workspace and the clock (centre) carry an accent.
;   left    launcher+web | workspaces | window title | music                at most ~840 px
;   centre  [rec] clock                                                       226 px, truly centred
;   right   tray | cpu mem | volume | battery | live mood power              about 790 px
; The widths are budgeted so the right end is never pushed off the screen: titles are
; cut at 14 characters, the music title scrolls inside 14.
include-file = ~/.config/polybar/colors.ini

[bar/main]
width = 100%:-16
height = 32
offset-x = 8
offset-y = 8
line-size = 2
background = #00000000
foreground = ${colors.fg}
; *-font = N and %{TN} count from 1: 1 = text, 2 = icons (a size up), 3 = bold
font-0 = JetBrainsMono Nerd Font:style=Medium:size=11;3
font-1 = JetBrainsMono Nerd Font Propo:size=14;3
font-2 = JetBrainsMono Nerd Font:style=Bold:size=11;3
; fallbacks for window titles / song names: symbols, CJK, emoji
font-3 = DejaVu Sans:size=11;3
font-4 = Noto Sans CJK JP:size=12;3
font-5 = Noto Color Emoji:scale=10;2
font-6 = JetBrainsMono Nerd Font:size=23;6
padding = 0
module-margin = 0
modules-left = capla ball web capra gap capl i3 capr gap capl title capr gap music
modules-center = rec capla time date capra
modules-right = caplt tray caprt gap capl cpu memory capr gap capl pulseaudio capr gap capl battery capr gap capl live mood power capr
enable-ipc = true
cursor-click = pointer
; Not an i3 dock: i3 would stretch a dock to full width at y=0 and ignore the
; offsets. i3 reserves the space instead (gaps top in the i3 config).
override-redirect = true
wm-restack = i3
compositing-background = source

; ---------------------------------------------------------------- left
; Poke Ball: left click = launcher, right click = file search, middle = a new mathematical wallpaper
[module/ball]
type = custom/text
format = "󰐝"
format-font = 2
format-background = ${colors.accent}
format-foreground = ${colors.bg-solid}
click-left = ~/.config/rofi/scripts/launcher.sh apps
click-right = ~/.config/rofi/scripts/launcher.sh files
click-middle = ~/.local/bin/rice art

; Globe: left click = bookmarks and web search, right click = new browser window, middle = choose profile
[module/web]
type = custom/text
format = " 󰖟"
format-font = 2
format-background = ${colors.accent}
format-foreground = ${colors.bg-solid}
click-left = ~/.config/rofi/scripts/launcher.sh web
click-right = thorium-browser --new-window
click-middle = ~/.config/i3/scripts/browser.sh

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
ws-icon-0 = 1;一
ws-icon-1 = 2;二
ws-icon-2 = 3;三
ws-icon-3 = 4;四
ws-icon-4 = 5;五
ws-icon-5 = 6;六
ws-icon-6 = 7;七
ws-icon-7 = 8;八
ws-icon-8 = 9;九
ws-icon-9 = 10;十
ws-icon-default = ◆
format = <label-state><label-mode>
format-background = ${colors.surface}
label-mode = " %mode% "
label-mode-background = ${colors.accent2}
label-mode-foreground = ${colors.bg-solid}
label-mode-font = 3
label-focused = %icon%
label-focused-font = 3
label-focused-foreground = ${colors.bg-solid}
label-focused-background = ${colors.accent}
label-focused-padding = 1
label-unfocused = %icon%
label-unfocused-foreground = ${colors.subtext}
label-unfocused-background = ${colors.surface}
label-unfocused-padding = 1
label-visible = %icon%
label-visible-foreground = ${colors.fg}
label-visible-background = ${colors.surface1}
label-visible-padding = 1
label-urgent = %icon%
label-urgent-font = 3
label-urgent-background = ${colors.crit}
label-urgent-foreground = ${colors.bg-solid}
label-urgent-padding = 1

[module/title]
type = internal/xwindow
format-background = ${colors.surface}
format-padding = 1
format-prefix = "󰖯 "
format-prefix-font = 2
format-prefix-foreground = ${colors.accent2}
label = %title:0:14:…%
label-foreground = ${colors.fg}
label-empty = desktop
label-empty-foreground = ${colors.dim}

; Now playing, for any player (browser tabs included). Nothing in it moves except a long title,
; and that scrolls inside a fixed width, so the bar never changes size.
; Click the title or the middle button: play / pause. Arrows: previous / next. Wheel: seek 5 s.
; Right click the title: hide it (and show it again).
[module/music]
type = custom/script
exec = ~/.config/polybar/scripts/music.sh
tail = true
scroll-up = ~/.config/polybar/scripts/music.sh ctl forward
scroll-down = ~/.config/polybar/scripts/music.sh ctl back
click-middle = ~/.config/i3/scripts/limusic-toggle.sh
label = %output%

; ---------------------------------------------------------------- centre
; Click the time: seconds. Click the date: this month's calendar.
[module/time]
type = internal/date
format-background = ${colors.accent}
format-padding = 1
interval = 1
time = %I:%M %p
time-alt = %I:%M:%S %p
format-prefix = "󰥔 "
format-prefix-font = 2
format-prefix-foreground = ${colors.bg-solid}
label = %time%
label-font = 3
label-foreground = ${colors.bg-solid}

[module/date]
type = custom/script
exec = date '+%d %b'
interval = 60
format-background = ${colors.accent}
format-padding = 1
label-foreground = ${colors.bg-solid}
click-left = ~/.config/polybar/scripts/calendar.sh

; ---------------------------------------------------------------- right
; Shown only while a screen recording runs (capture.sh). Click = stop.
[module/rec]
type = custom/script
exec = ~/.config/polybar/scripts/rec.sh
interval = 1
click-left = ~/.config/i3/scripts/capture.sh rec stop

[module/tray]
type = internal/tray
tray-spacing = 8
tray-size = 62%
tray-background = ${colors.tray}
format-background = ${colors.tray}

[module/cpu]
type = internal/cpu
format-background = ${colors.surface}
format-padding = 1
format-warn-background = ${colors.surface}
format-warn-padding = 1
interval = 2
format = <ramp-load> <label>
format-prefix = "󰍛 "
format-prefix-font = 2
format-prefix-foreground = ${colors.blue}
label = %percentage:2%%
ramp-load-0 = ▁
ramp-load-0-foreground = ${colors.blue}
ramp-load-1 = ▂
ramp-load-1-foreground = ${colors.cyan}
ramp-load-2 = ▃
ramp-load-2-foreground = ${colors.cyan}
ramp-load-3 = ▄
ramp-load-3-foreground = ${colors.green}
ramp-load-4 = ▅
ramp-load-4-foreground = ${colors.green}
ramp-load-5 = ▆
ramp-load-5-foreground = ${colors.yellow}
ramp-load-6 = ▇
ramp-load-6-foreground = ${colors.warn}
ramp-load-7 = █
ramp-load-7-foreground = ${colors.crit}
warn-percentage = 90
format-warn-prefix = "󰍛 "
format-warn-prefix-font = 2
format-warn-prefix-foreground = ${colors.crit}
format-warn = <ramp-load> <label-warn>
label-warn = %percentage:2%%
label-warn-foreground = ${colors.crit}

[module/memory]
type = internal/memory
format-background = ${colors.surface}
format-padding = 1
format-warn-background = ${colors.surface}
format-warn-padding = 1
interval = 3
format-prefix = "󰘚 "
format-prefix-font = 2
format-prefix-foreground = ${colors.magenta}
label = %percentage_used:2%%
warn-percentage = 90
format-warn-prefix = "󰘚 "
format-warn-prefix-font = 2
format-warn-prefix-foreground = ${colors.crit}
format-warn = <label-warn>
label-warn = %percentage_used:2%%
label-warn-foreground = ${colors.crit}

; Wheel changes the volume, click mutes, right click opens the mixer. (Wi-Fi lives in the tray.)
[module/pulseaudio]
type = internal/pulseaudio
format-volume-background = ${colors.surface}
format-volume-padding = 1
format-muted-background = ${colors.surface}
format-muted-padding = 1
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage:3%%
label-muted = 󰝟 mute
label-muted-foreground = ${colors.dim}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-font = 2
ramp-volume-foreground = ${colors.bryellow}
click-right = pavucontrol

; Battery as a hit-point bar: green above half, yellow below, red under a fifth.
[module/battery]
type = custom/script
format-background = ${colors.surface}
format-padding = 1
exec = ~/.config/polybar/scripts/battery.sh
interval = 15
click-left = ~/.config/i3/scripts/settings.sh

; Mood: night / day / paper. Left click = next mood, right click = mood and wallpaper menu
; Live wallpaper: play = a live wallpaper moves, pause = held still, picture = a normal wallpaper.
; Click: moves / holds still (opens the picker when a normal picture is shown). Right click: picker. Wheel: next / previous live wallpaper.
[module/live]
type = custom/script
format-background = ${colors.surface}
format-padding = 1
exec = ~/.config/polybar/scripts/live.sh
interval = 3600
click-left = ~/.config/polybar/scripts/live-click.sh
click-right = ~/.local/bin/rice pick
scroll-up = ~/.local/bin/rice scene next
scroll-down = ~/.local/bin/rice scene prev

[module/mood]
type = custom/script
format-background = ${colors.surface}
format-padding = 1
exec = ~/.config/polybar/scripts/mood.sh
interval = 3600
click-left = ~/.local/bin/rice mode next
click-right = ~/.local/bin/rice menu

[module/power]
type = custom/text
format = "⏻ "
format-font = 2
format-background = ${colors.surface}
format-foreground = ${colors.crit}
click-left = ~/.config/i3/scripts/powermenu.sh

; ---------------------------------------------------------------- pill ends
[module/capl]
type = custom/text
format = ""
format-font = 7
format-foreground = ${colors.surface}

[module/capr]
type = custom/text
format = ""
format-font = 7
format-foreground = ${colors.surface}

; the same ends for the tray pill, which is dark in every mood (see `tray` in theme/apply.py)
[module/caplt]
type = custom/text
format = ""
format-font = 7
format-foreground = ${colors.tray}

[module/caprt]
type = custom/text
format = ""
format-font = 7
format-foreground = ${colors.tray}

[module/capla]
type = custom/text
format = ""
format-font = 7
format-foreground = ${colors.accent}

[module/capra]
type = custom/text
format = ""
format-font = 7
format-foreground = ${colors.accent}

[module/gap]
type = custom/text
format = " "

[settings]
screenchange-reload = true
pseudo-transparency = false
