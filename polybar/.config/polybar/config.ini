; Colours: colors.ini (generated by ~/dotfiles/theme/apply.py)
; Rounded corners + shadow come from picom (corner-radius), not from polybar.
include-file = ~/.config/polybar/colors.ini

[bar/main]
width = 100%:-16
height = 32
offset-x = 8
offset-y = 8
border-size = 1
border-color = ${colors.surface}
line-size = 2
background = ${colors.bg}
foreground = ${colors.fg}
; *-font = N and %{TN} count from 1: 1 = text, 2 = icons (a size up), 3 = bold
font-0 = JetBrainsMono Nerd Font:style=Medium:size=10;3
font-1 = JetBrainsMono Nerd Font:size=13;3
font-2 = JetBrainsMono Nerd Font:style=Bold:size=10;3
; fallbacks for window titles / song names: symbols, CJK, emoji
font-3 = DejaVu Sans:size=10;3
font-4 = Noto Sans CJK JP:size=10;3
font-5 = Noto Color Emoji:scale=10;2
padding-left = 1
padding-right = 2
module-margin = 2
modules-left = i3 music title
modules-center = time date
modules-right = tray pulseaudio wifi eth cpu memory battery power
enable-ipc = true
cursor-click = pointer
; Not an i3 dock: i3 would stretch a dock to full width at y=0 and ignore the
; offsets. i3 reserves the space instead (gaps top in the i3 config).
override-redirect = true
wm-restack = i3

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
format = <label-state> <label-mode>
label-mode = " %mode% "
label-mode-background = ${colors.accent2}
label-mode-foreground = ${colors.bg-solid}
label-mode-font = 3
label-focused = %name%
label-focused-font = 3
label-focused-foreground = ${colors.accent}
label-focused-background = ${colors.surface}
label-focused-underline = ${colors.accent}
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-foreground = ${colors.subtext}
label-unfocused-padding = 2
label-visible = %name%
label-visible-foreground = ${colors.subtext}
label-visible-underline = ${colors.surface1}
label-visible-padding = 2
label-urgent = %name%
label-urgent-font = 3
label-urgent-background = ${colors.crit}
label-urgent-foreground = ${colors.bg-solid}
label-urgent-padding = 2

[module/music]
type = custom/script
exec = ~/.config/polybar/scripts/music.sh
tail = true
click-left = playerctl -p limusic play-pause
click-right = playerctl -p limusic next
click-middle = ~/.config/i3/scripts/limusic-toggle.sh
format-prefix = "󰎆 "
format-prefix-font = 2
format-prefix-foreground = ${colors.accent2}
label = %output:0:36:…%
label-foreground = ${colors.subtext}

[module/title]
type = internal/xwindow
format-prefix = "󰖯 "
format-prefix-font = 2
format-prefix-foreground = ${colors.dim}
label = %title:0:48:…%
label-foreground = ${colors.dim}
label-empty = desktop
label-empty-foreground = ${colors.dim}

[module/time]
type = internal/date
interval = 5
time = %I:%M %p
format-prefix = "󰥔 "
format-prefix-font = 2
format-prefix-foreground = ${colors.accent}
label = %time%
label-font = 3
label-foreground = ${colors.fg}

[module/date]
type = internal/date
interval = 60
date = %a %d %b
label = %date%
label-foreground = ${colors.dim}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = 󰝟 mute
label-muted-font = 1
label-muted-foreground = ${colors.dim}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-font = 2
ramp-volume-foreground = ${colors.accent}
click-right = pavucontrol

[module/wifi]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <ramp-signal> <label-connected>
label-connected = %essid:0:14:…%
ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨
ramp-signal-font = 2
ramp-signal-foreground = ${colors.accent}
format-disconnected = <label-disconnected>
label-disconnected = 󰤭
label-disconnected-font = 2
label-disconnected-foreground = ${colors.dim}
click-left = nm-connection-editor

[module/eth]
type = internal/network
interface-type = wired
interval = 5
format-connected-prefix = "󰈀 "
format-connected-prefix-font = 2
format-connected-prefix-foreground = ${colors.accent}
label-connected = lan
format-disconnected =

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰍛 "
format-prefix-font = 2
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%
warn-percentage = 90
format-warn-prefix = "󰍛 "
format-warn-prefix-font = 2
format-warn-prefix-foreground = ${colors.crit}
format-warn = <label-warn>
label-warn = %percentage:2%%
label-warn-foreground = ${colors.crit}

[module/memory]
type = internal/memory
interval = 3
format-prefix = "󰘚 "
format-prefix-font = 2
format-prefix-foreground = ${colors.accent}
label = %percentage_used:2%%
warn-percentage = 90
format-warn-prefix = "󰘚 "
format-warn-prefix-font = 2
format-warn-prefix-foreground = ${colors.crit}
format-warn = <label-warn>
label-warn = %percentage_used:2%%
label-warn-foreground = ${colors.crit}

[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
interval = 15
click-left = ~/.config/i3/scripts/settings.sh

[module/power]
type = custom/text
format = "⏻"
format-font = 2
format-foreground = ${colors.crit}
click-left = ~/.config/i3/scripts/powermenu.sh

[module/tray]
type = internal/tray
tray-spacing = 8
tray-size = 55%
tray-background = ${colors.bg}

[settings]
screenchange-reload = true
pseudo-transparency = false
